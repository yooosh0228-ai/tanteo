name: Compilar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Probar el motor de puntuación
        working-directory: ScoreKit
        run: swift test

      - name: Generar el proyecto de Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar app de iPhone + reloj (simulador)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tanteo.xcodeproj \
            -scheme Tanteo \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 60

      - name: Compilar app del reloj sola (simulador)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tanteo.xcodeproj \
            -scheme TanteoWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 60
